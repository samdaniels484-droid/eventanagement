<!DOCTYPE html>
<html>

<head>
    <title>Booking Confirmed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial
        }

        body {
            background: #f2f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh
        }

        .box {
            background: #fff;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            width: 340px
        }

        .tick {
            font-size: 70px;
            background: #dcfce7;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px
        }

        h1 {
            color: #16a34a;
            font-size: 26px;
            margin-bottom: 8px
        }

        p {
            color: #555;
            margin-bottom: 20px
        }

        .status {
            background: #dcfce7;
            color: #16a34a;
            padding: 10px;
            border-radius: 20px;
            font-weight: bold
        }

        a {
            display: inline-block;
            margin-top: 20px;
            background: #4f46e5;
            color: #fff;
            padding: 11px 22px;
            border-radius: 10px;
            text-decoration: none
        }
    </style>
</head>

<body>

    <div class="box">
        <div class="tick">✅</div>
        <h1>Booking Confirmed!</h1>
        <p>Your booking is confirmed.</p>
        <div class="status">Status: CONFIRMED ✅</div>
        <br><br>
        <a href="index.html">Back to Home</a>
    </div>

</body>

</html>
